# GitHub Pages configuration for the Haru.NET documentation.
# Publish with: Settings → Pages → Build and deployment → Deploy from a branch → main, /docs

title: Haru.NET
description: PDF generation library for .NET 8 — a port of the Haru Free PDF Library
theme: jekyll-theme-primer

# Rewrite links between .md files to the generated .html pages
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
