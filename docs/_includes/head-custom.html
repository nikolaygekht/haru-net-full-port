<!-- Included by the jekyll-theme-primer layout inside <head>. -->
<!-- Renders ```mermaid code blocks as diagrams: kramdown emits them as highlighted code, -->
<!-- so they are replaced with <pre class="mermaid"> containers before Mermaid runs. -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';

  mermaid.initialize({ startOnLoad: false });

  const blocks = document.querySelectorAll('div.language-mermaid, pre > code.language-mermaid');
  for (const block of blocks) {
    const container = block.matches('code') ? block.parentElement : block;
    const diagram = document.createElement('pre');
    diagram.className = 'mermaid';
    diagram.textContent = block.textContent;
    container.replaceWith(diagram);
  }

  if (blocks.length > 0) {
    await mermaid.run();
  }
</script>
